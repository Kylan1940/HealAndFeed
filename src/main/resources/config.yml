# HEAL AND FEED CONFIGURATION
#
# HELP:
# - " " for new line
# & for color and special symbols
# %prefix% for prefix
# %player% for player (used for heal other and feed other)
# %time% for remaining cooldown time in seconds
#
# example-
# healall:
# - "%prefix%Healed Players:"
# - "&6All players"

# Config Version
# DON'T CHANGE THIS!!!
config-version: 3

# Prefix:
prefix: "&7[&bHealAndFeed&7] "

# Cooldown
# Set to 0 to disable cooldown
cooldown:
  heal: 0
  feed: 0

# Messages:
messages:
  heal:
    - "%prefix%&aYou've been healed."
  heal-other:
    - "%prefix%&aYou healed &e%player%&a."
  heal-all:
    - "%prefix%&aAll players have been healed."
  fed:
    - "%prefix%&aYou're full."
  feed-other:
    - "%prefix%&aYou fed &e%player%&a."
  feed-all:
    - "%prefix%&aAll players have been fed."
  cooldown:
    heal:
      - "%prefix%&cYou must wait &e%time%&cs before using heal again."
    feed:
      - "%prefix%&cYou must wait &e%time%&cs before using feed again."

console-command:
  heal:
    - "%prefix%&cConsole must specify a player."
  feed:
    - "%prefix%&cConsole must use /feed <player>."
  healall:
    - "%prefix%&aAll online players have been healed."
  feedall:
    - "%prefix%&aAll online players have been fed."
  player-only:
    - "%prefix%This command is player-only"

no-player:
  found:
    - "%prefix%&cThis player does not exist."
  online:
    - "%prefix%&cThere are no online players."

no-permission:
  heal:
    - "%prefix%&cYou don't have permission to use /heal."
  healother:
    - "%prefix%&cYou don't have permission to heal other players."
  healall:
    - "%prefix%&cYou don't have permission to use /healall."
  feed:
    - "%prefix%&cYou don't have permission to use /feed."
  feedother:
    - "%prefix%&cYou don't have permission to feed other players."
  feedall:
    - "%prefix%&cYou don't have permission to use /feedall."